services:

  app:
    build: .
    container_name: cloud-devops-api
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: tasks
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: cloud-devops-postgres
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
